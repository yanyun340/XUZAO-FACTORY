<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" class="xuzao-mark" role="img" aria-label="序造 XuZao">
  <style>
    /* 独立使用时跟随深浅色；内联到页面时由 currentColor 继承 */
    @media (prefers-color-scheme: dark) {
      .xuzao-mark { color: #ffffff; }
    }
  </style>
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter">
    <!-- 立方体：2:1 等距投影，9 条可见棱 -->
    <path d="M16 6.41 25 11.6V22L16 27.19 7 22V11.6Z" />
    <!-- 予：近角引出的内折 ＋ 正面竖棱落到下尖点，收笔即竖钩 -->
    <path d="M16 16.8 25 11.6M16 16.8 7 11.6M16 16.8V27.19" />
    <!-- 广：顶面以近角为原点外扩 1.19×，出檐与顶面之间留白缝 -->
    <path d="M16 4.81 26.39 10.8 16 16.8 5.61 10.8Z" />
  </g>
</svg>